basePath: /api
definitions:
  handlers.TuyaAPIResponse:
    properties:
      data: {}
      debug: {}
      error:
        type: string
      message:
        type: string
      success:
        type: boolean
    type: object
  handlers.TuyaDeviceResponse:
    properties:
      result: {}
      success:
        type: boolean
      t:
        type: integer
      tid:
        type: string
    type: object
  handlers.TuyaTokenResponse:
    properties:
      result:
        properties:
          access_token:
            type: string
          expire_time:
            type: integer
          refresh_token:
            type: string
          uid:
            type: string
        type: object
      success:
        type: boolean
      t:
        type: integer
      tid:
        type: string
    type: object
host: localhost:8080
info:
  contact:
    email: support@swagger.io
    name: Soporte API
    url: http://www.swagger.io/support
  description: API Gateway para Tuya Cloud con listener de mensajes Pulsar para cambios
    de estado de dispositivos
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  termsOfService: http://swagger.io/terms/
  title: API Gateway Tuya Go - SDK Oficial con Listener Pulsar
  version: "1.0"
paths:
  /pulsar/status:
    get:
      consumes:
      - application/json
      description: Obtiene información detallada del estado actual del listener de
        Pulsar incluyendo configuración y conectividad. El listener se inicia automáticamente
        con el servidor.
      produces:
      - application/json
      responses:
        "200":
          description: Estado detallado del listener con configuración y métricas
          schema:
            additionalProperties: true
            type: object
      summary: Obtener estado del listener de Pulsar
      tags:
      - Pulsar
  /tuya/device/{deviceId}:
    get:
      consumes:
      - application/json
      description: Obtiene información de un dispositivo específico por su ID
      parameters:
      - description: ID del dispositivo
        in: path
        name: deviceId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Información del dispositivo obtenida exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/handlers.TuyaAPIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.TuyaDeviceResponse'
              type: object
        "400":
          description: ID de dispositivo requerido
          schema:
            $ref: '#/definitions/handlers.TuyaAPIResponse'
        "500":
          description: Error al obtener información del dispositivo
          schema:
            $ref: '#/definitions/handlers.TuyaAPIResponse'
      summary: Obtener información de dispositivo
      tags:
      - tuya
  /tuya/token:
    get:
      consumes:
      - application/json
      description: Obtiene un token de acceso de Tuya Cloud API usando las credenciales
        configuradas
      produces:
      - application/json
      responses:
        "200":
          description: Token obtenido exitosamente
          schema:
            allOf:
            - $ref: '#/definitions/handlers.TuyaAPIResponse'
            - properties:
                data:
                  $ref: '#/definitions/handlers.TuyaTokenResponse'
              type: object
        "500":
          description: Error al obtener token
          schema:
            $ref: '#/definitions/handlers.TuyaAPIResponse'
      summary: Obtener token de acceso de Tuya
      tags:
      - tuya
swagger: "2.0"
